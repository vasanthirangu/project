<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Job Application Form</h3>
    <form action="headings.html">
    <fieldset>
        <legend>Personal Details: </legend><br>
        <label>Full Name: </label>
        <input type="text" required><br>
        <br>
        <label>Email ID: </label>
        <input type="email" ><br>
        <br>
        <label>Mobile Number: </label>
        <input type="number"><br>
        <br>
        <label>Gender: </label>
        <input type="radio" name="gender" value="female">
        <label>Female</label>
        <input type="radio" name="gender" value="male">
        <label>Male</label><br>
        <br>
        <label>Date of Birth: </label>
        <input type="date"><br>
        <br>
        <label>Permanent Address: </label>
        <textarea rows="3" cols="30"></textarea><br>
    </fieldset>
    <br>
    <fieldset>
        <legend>Education Details: </legend><br>
        <label>Degree </label>
        <select>
            <option disabled selected>-- Select --</option>
            <option>Graduation</option>
            <option>Intermediate</option>
            <option>High School</option>
        </select><br>
        <br>
        <label>Institution Name: </label>
        <input type="text">
        <label>Board: </label>
        <input type="text"><br><br>
        <label>  Pass Out Year: </label>
        <input type="number">
        <label>CGPA/Percentage: </label>
        <input type="number"><br>
        <br>
        <label>Degree: </label>
        <select>
            <option disabled selected>-- Select --</option>
            <option>Graduation</option>
            <option>Intermediate</option>
            <option>High School</option>
        </select><br><br>
        <label>College Name: </label>
        <input type="text">
        <label>Board: </label>
        <input type="text"><br><br>
        <label>  Pass Out Year: </label>
        <input type="number">
        <label>CGPA/Percentage: </label>
        <input type="number"><br>
        <br>
        <label>Degree: </label>
        <select>
            <option disabled selected>-- Select --</option>
            <option>Graduation</option>
            <option>Intermediate</option>
            <option>High School</option>
        </select><br><br>
        <label>Name: </label>
        <input type="text">
        <label>Board: </label>
        <input type="text"><br><br>
        <label>  Pass Out Year: </label>
        <input type="number">
        <label>CGPA/Percentage: </label>
        <input type="number"><br>
    </fieldset>
    <br>
    <fieldset>
        <legend>Experience & Skills: </legend><br>
        <label>Years of Experience: </label>
        <select>
            <option disabled selected>-- Select --</option>
            <option>Fresher</option>
            <option>1-3 Years</option>
            <option>4-6 Years</option>
            <option>7-10 Years</option>
            <option>More than 10 Years</option>
        </select><br>
        <br>
        <label>Organization Name:  <small>(if not applicable fill N/A)</small> </label>
        <input type="text"><br>
        <br>
        <label>Notice period: </label>
        <select>
            <option disabled selected>-- Choose --</option>
            <option>0-15 days</option>
            <option>15-30 days</option>
            <option>Within 2 months</option>
            <option>More than 2 months</option>
        </select><br>
        <br>
        <label>Skills: </label>
        <textarea rows="2" cols="50" placeholder="Seperate your skills with comma"></textarea>
    </fieldset><br>
    <fieldset>
        <legend>Documents: </legend><br>
        <label>Upload Resume: </label>
        <input type="file" required><br><br>
        <label>Cover letter: <small>(optional)</small></label>
        <input type="file"><br><br>
        <label>Picture: </label>
        <input type="file">
    </fieldset>
    <br>
    <fieldset>
        <legend>Terms & Conditions: </legend><br>
        <input type="checkbox" required><label>1. I confirm that the information provided in this application is true and accurate.</label><br>
        <input type="checkbox" required><label>2. I agree that the company may use my information for recruitment purposes.</label><br>
        <input type="checkbox" required><label required>3. I understand that submitting this application does not guarantee employment.</label>
        <br><br>
    </fieldset><br>
    <input type="Submit" value="Submit">
    <input type="reset" value="Reset">
    </form>
</body>
</html>
